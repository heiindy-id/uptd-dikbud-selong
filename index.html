<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SI UPTD Dikbud Selong</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .sidebar-item:hover { background: rgba(255,255,255,0.1); }
    .sidebar-item.active { background: rgba(255,255,255,0.15); border-left: 3px solid #fbbf24; }
    .card-stat { transition: all 0.3s ease; }
    .card-stat:hover { transform: translateY(-5px); box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
    .btn-primary { transition: all 0.2s ease; }
    .btn-primary:hover { transform: scale(1.02); }
    .table-row:hover { background: #f8fafc; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    .login-bg { background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 50%, #1e3a5f 100%); }
    .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
    .toast { animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="h-full bg-slate-100">
  <div id="app" class="h-full overflow-auto"></div>
  <script>
    // ===== CONFIGURATION =====
    const defaultConfig = {
      nama_instansi: "UPTD Dinas Pendidikan dan Kebudayaan Kecamatan Selong",
      alamat_instansi: "Jl. Pendidikan No. 1, Selong, Lombok Timur, NTB",
      primary_color: "#1e3a5f",
      secondary_color: "#f8fafc",
      accent_color: "#fbbf24",
      text_color: "#1e293b",
      danger_color: "#ef4444"
    };

    let config = { ...defaultConfig };
    let currentUser = null;
    let currentPage = 'login';
    let allData = [];
    let isLoading = false;
    let editingItem = null;
    let deleteConfirmId = null;
    let searchQuery = '';
    let filterStatus = 'all';

    // ===== TOAST NOTIFICATION =====
    function showToast(message, type = 'success') {
      const existing = document.getElementById('toast');
      if (existing) existing.remove();
      
      const colors = {
        success: 'bg-emerald-500',
        error: 'bg-red-500',
        warning: 'bg-amber-500',
        info: 'bg-blue-500'
      };
      
      const toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = `toast fixed top-4 right-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2`;
      toast.innerHTML = `
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="ml-2 hover:opacity-80">✕</button>
      `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ===== DATA HELPERS =====
    function getPegawai() { return allData.filter(d => d.type === 'pegawai'); }
    function getPelayanan() { return allData.filter(d => d.type === 'pelayanan'); }
    function getUsers() { return allData.filter(d => d.type === 'user'); }

    // ===== LOGIN PAGE =====
    function renderLogin() {
      return `
        <div class="login-bg h-full flex items-center justify-center p-4">
          <div class="glass-card rounded-2xl shadow-2xl w-full max-w-md p-8 fade-in">
            <div class="text-center mb-8">
              <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl flex items-center justify-center shadow-lg">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
              </div>
              <h1 class="text-2xl font-bold text-slate-800">SISTEM INFORMASI</h1>
              <p class="text-sm text-slate-600 mt-1">${config.nama_instansi}</p>
            </div>
            
            <form id="loginForm" class="space-y-5">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                <input type="text" id="loginUsername" required
                  class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-blue-500 transition"
                  placeholder="Masukkan username">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                <input type="password" id="loginPassword" required
                  class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-blue-500 transition"
                  placeholder="Masukkan password">
              </div>
              <button type="submit" class="btn-primary w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 rounded-xl font-semibold shadow-lg hover:shadow-xl">
                ${isLoading ? '<span class="animate-pulse">Memproses...</span>' : 'Masuk'}
              </button>
            </form>
            
            <div class="mt-6 p-4 bg-slate-50 rounded-xl">
              <p class="text-xs text-slate-500 text-center">
                <strong>Demo Login:</strong><br>
                Admin: admin / admin123<br>
                Operator: operator / operator123
              </p>
            </div>
          </div>
        </div>
      `;
    }

    // ===== SIDEBAR =====
    function renderSidebar() {
      const menuItems = [
        { id: 'dashboard', icon: '📊', label: 'Dashboard' },
        { id: 'pegawai', icon: '👥', label: 'Data Kepegawaian' },
        { id: 'pelayanan', icon: '📋', label: 'Data Pelayanan' },
        { id: 'laporan', icon: '📑', label: 'Laporan' },
      ];
      
      if (currentUser?.role === 'admin') {
        menuItems.push({ id: 'users', icon: '⚙️', label: 'Manajemen Pengguna' });
      }

      return `
        <aside class="w-64 bg-gradient-to-b from-slate-800 to-slate-900 text-white flex flex-col h-full">
          <div class="p-5 border-b border-slate-700">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-amber-500 rounded-lg flex items-center justify-center">
                <span class="text-lg">🏛️</span>
              </div>
              <div>
                <h2 class="font-bold text-sm">SI UPTD</h2>
                <p class="text-xs text-slate-400">Dikbud Selong</p>
              </div>
            </div>
          </div>
          
          <nav class="flex-1 py-4 overflow-y-auto">
            ${menuItems.map(item => `
              <button onclick="navigateTo('${item.id}')" 
                class="sidebar-item w-full flex items-center gap-3 px-5 py-3 text-left text-sm ${currentPage === item.id ? 'active' : 'text-slate-300'}">
                <span class="text-lg">${item.icon}</span>
                <span>${item.label}</span>
              </button>
            `).join('')}
          </nav>
          
          <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3 mb-3">
              <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-sm font-bold">
                ${currentUser?.nama?.charAt(0) || 'U'}
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate">${currentUser?.nama || 'User'}</p>
                <p class="text-xs text-slate-400 capitalize">${currentUser?.role || 'Guest'}</p>
              </div>
            </div>
            <button onclick="logout()" class="w-full bg-red-500/20 hover:bg-red-500/30 text-red-400 py-2 rounded-lg text-sm transition">
              🚪 Keluar
            </button>
          </div>
        </aside>
      `;
    }

    // ===== DASHBOARD =====
    function renderDashboard() {
      const totalPegawai = getPegawai().length;
      const totalPelayanan = getPelayanan().length;
      const pelayananSelesai = getPelayanan().filter(p => p.status === 'selesai').length;
      const pelayananProses = getPelayanan().filter(p => p.status === 'proses').length;

      return `
        <div class="p-6 fade-in">
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Dashboard</h1>
            <p class="text-slate-600">Selamat datang, ${currentUser?.nama || 'User'}!</p>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="card-stat bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-6 text-white shadow-lg">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-blue-100 text-sm">Total Pegawai</p>
                  <p class="text-4xl font-bold mt-2">${totalPegawai}</p>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">👥</div>
              </div>
            </div>
            
            <div class="card-stat bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl p-6 text-white shadow-lg">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-emerald-100 text-sm">Total Pelayanan</p>
                  <p class="text-4xl font-bold mt-2">${totalPelayanan}</p>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">📋</div>
              </div>
            </div>
            
            <div class="card-stat bg-gradient-to-br from-amber-500 to-amber-600 rounded-2xl p-6 text-white shadow-lg">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-amber-100 text-sm">Pelayanan Selesai</p>
                  <p class="text-4xl font-bold mt-2">${pelayananSelesai}</p>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">✅</div>
              </div>
            </div>
            
            <div class="card-stat bg-gradient-to-br from-purple-500 to-purple-600 rounded-2xl p-6 text-white shadow-lg">
              <div class="flex justify-between items-start">
                <div>
                  <p class="text-purple-100 text-sm">Dalam Proses</p>
                  <p class="text-4xl font-bold mt-2">${pelayananProses}</p>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">⏳</div>
              </div>
            </div>
          </div>
          
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl shadow-sm p-6">
              <h3 class="text-lg font-semibold text-slate-800 mb-4">📋 Pelayanan Terbaru</h3>
              ${getPelayanan().length === 0 ? `
                <p class="text-slate-500 text-center py-8">Belum ada data pelayanan</p>
              ` : `
                <div class="space-y-3">
                  ${getPelayanan().slice(0, 5).map(p => `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                      <div>
                        <p class="font-medium text-slate-800">${p.jenis_pelayanan || '-'}</p>
                        <p class="text-sm text-slate-500">${p.pemohon || '-'}</p>
                      </div>
                      <span class="px-3 py-1 rounded-full text-xs font-medium ${
                        p.status === 'selesai' ? 'bg-emerald-100 text-emerald-700' :
                        p.status === 'proses' ? 'bg-amber-100 text-amber-700' :
                        'bg-slate-100 text-slate-700'
                      }">${p.status || 'pending'}</span>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm p-6">
              <h3 class="text-lg font-semibold text-slate-800 mb-4">👥 Pegawai Terbaru</h3>
              ${getPegawai().length === 0 ? `
                <p class="text-slate-500 text-center py-8">Belum ada data pegawai</p>
              ` : `
                <div class="space-y-3">
                  ${getPegawai().slice(0, 5).map(p => `
                    <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
                      <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">
                        ${p.nama?.charAt(0) || '?'}
                      </div>
                      <div>
                        <p class="font-medium text-slate-800">${p.nama || '-'}</p>
                        <p class="text-sm text-slate-500">${p.jabatan || '-'}</p>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // ===== PEGAWAI PAGE =====
    function renderPegawai() {
      const data = getPegawai().filter(p => {
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          return p.nama?.toLowerCase().includes(q) || 
                 p.nip?.toLowerCase().includes(q) ||
                 p.jabatan?.toLowerCase().includes(q);
        }
        return true;
      });

      return `
        <div class="p-6 fade-in">
          <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div>
              <h1 class="text-2xl font-bold text-slate-800">Data Kepegawaian</h1>
              <p class="text-slate-600">Kelola data pegawai UPTD</p>
            </div>
            <button onclick="openModal('pegawai')" class="btn-primary bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg flex items-center gap-2">
              <span>➕</span> Tambah Pegawai
            </button>
          </div>
          
          <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="p-4 border-b border-slate-100">
              <div class="flex flex-wrap gap-3">
                <input type="text" placeholder="🔍 Cari nama, NIP, atau jabatan..." 
                  value="${searchQuery}"
                  onkeyup="handleSearch(this.value)"
                  class="flex-1 min-w-[200px] px-4 py-2.5 border border-slate-200 rounded-xl focus:border-blue-500">
              </div>
            </div>
            
            <div class="overflow-x-auto">
              ${data.length === 0 ? `
                <div class="text-center py-12">
                  <div class="text-5xl mb-3">📂</div>
                  <p class="text-slate-500">Belum ada data pegawai</p>
                </div>
              ` : `
                <table class="w-full">
                  <thead class="bg-slate-50">
                    <tr>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">No</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Nama</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">NIP</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Jabatan</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Pangkat/Gol</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Status</th>
                      <th class="px-4 py-3 text-center text-xs font-semibold text-slate-600 uppercase">Aksi</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${data.map((p, i) => `
                      <tr class="table-row">
                        <td class="px-4 py-3 text-sm text-slate-600">${i + 1}</td>
                        <td class="px-4 py-3">
                          <div class="flex items-center gap-3">
                            <div class="w-9 h-9 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-semibold text-sm">
                              ${p.nama?.charAt(0) || '?'}
                            </div>
                            <span class="font-medium text-slate-800">${p.nama || '-'}</span>
                          </div>
                        </td>
                        <td class="px-4 py-3 text-sm text-slate-600 font-mono">${p.nip || '-'}</td>
                        <td class="px-4 py-3 text-sm text-slate-600">${p.jabatan || '-'}</td>
                        <td class="px-4 py-3 text-sm text-slate-600">${p.pangkat || '-'} / ${p.golongan || '-'}</td>
                        <td class="px-4 py-3">
                          <span class="px-2 py-1 rounded-full text-xs font-medium ${
                            p.status === 'aktif' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'
                          }">${p.status || 'aktif'}</span>
                        </td>
                        <td class="px-4 py-3">
                          <div class="flex items-center justify-center gap-2">
                            <button onclick="editItem('${p.__backendId}')" class="p-2 hover:bg-blue-50 rounded-lg text-blue-600" title="Edit">✏️</button>
                            ${deleteConfirmId === p.__backendId ? `
                              <button onclick="confirmDelete('${p.__backendId}')" class="px-3 py-1 bg-red-500 text-white rounded-lg text-xs">Ya, Hapus</button>
                              <button onclick="cancelDelete()" class="px-3 py-1 bg-slate-200 text-slate-600 rounded-lg text-xs">Batal</button>
                            ` : `
                              <button onclick="startDelete('${p.__backendId}')" class="p-2 hover:bg-red-50 rounded-lg text-red-600" title="Hapus">🗑️</button>
                            `}
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // ===== PELAYANAN PAGE =====
    function renderPelayanan() {
      let data = getPelayanan().filter(p => {
        let match = true;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          match = p.jenis_pelayanan?.toLowerCase().includes(q) || 
                  p.pemohon?.toLowerCase().includes(q);
        }
        if (filterStatus !== 'all') {
          match = match && p.status === filterStatus;
        }
        return match;
      });

      return `
        <div class="p-6 fade-in">
          <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div>
              <h1 class="text-2xl font-bold text-slate-800">Data Pelayanan</h1>
              <p class="text-slate-600">Kelola data pelayanan UPTD</p>
            </div>
            <button onclick="openModal('pelayanan')" class="btn-primary bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg flex items-center gap-2">
              <span>➕</span> Tambah Pelayanan
            </button>
          </div>
          
          <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="p-4 border-b border-slate-100">
              <div class="flex flex-wrap gap-3">
                <input type="text" placeholder="🔍 Cari pelayanan atau pemohon..." 
                  value="${searchQuery}"
                  onkeyup="handleSearch(this.value)"
                  class="flex-1 min-w-[200px] px-4 py-2.5 border border-slate-200 rounded-xl focus:border-blue-500">
                <select onchange="handleFilter(this.value)" class="px-4 py-2.5 border border-slate-200 rounded-xl focus:border-blue-500">
                  <option value="all" ${filterStatus === 'all' ? 'selected' : ''}>Semua Status</option>
                  <option value="pending" ${filterStatus === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="proses" ${filterStatus === 'proses' ? 'selected' : ''}>Dalam Proses</option>
                  <option value="selesai" ${filterStatus === 'selesai' ? 'selected' : ''}>Selesai</option>
                </select>
              </div>
            </div>
            
            <div class="overflow-x-auto">
              ${data.length === 0 ? `
                <div class="text-center py-12">
                  <div class="text-5xl mb-3">📋</div>
                  <p class="text-slate-500">Belum ada data pelayanan</p>
                </div>
              ` : `
                <table class="w-full">
                  <thead class="bg-slate-50">
                    <tr>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">No</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Jenis Pelayanan</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Pemohon</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Tgl Pengajuan</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Tgl Selesai</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Status</th>
                      <th class="px-4 py-3 text-center text-xs font-semibold text-slate-600 uppercase">Aksi</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${data.map((p, i) => `
                      <tr class="table-row">
                        <td class="px-4 py-3 text-sm text-slate-600">${i + 1}</td>
                        <td class="px-4 py-3 font-medium text-slate-800">${p.jenis_pelayanan || '-'}</td>
                        <td class="px-4 py-3 text-sm text-slate-600">${p.pemohon || '-'}</td>
                        <td class="px-4 py-3 text-sm text-slate-600">${p.tanggal_pengajuan || '-'}</td>
                        <td class="px-4 py-3 text-sm text-slate-600">${p.tanggal_selesai || '-'}</td>
                        <td class="px-4 py-3">
                          <span class="px-2 py-1 rounded-full text-xs font-medium ${
                            p.status === 'selesai' ? 'bg-emerald-100 text-emerald-700' :
                            p.status === 'proses' ? 'bg-amber-100 text-amber-700' :
                            'bg-slate-100 text-slate-600'
                          }">${p.status || 'pending'}</span>
                        </td>
                        <td class="px-4 py-3">
                          <div class="flex items-center justify-center gap-2">
                            <button onclick="editItem('${p.__backendId}')" class="p-2 hover:bg-blue-50 rounded-lg text-blue-600" title="Edit">✏️</button>
                            ${deleteConfirmId === p.__backendId ? `
                              <button onclick="confirmDelete('${p.__backendId}')" class="px-3 py-1 bg-red-500 text-white rounded-lg text-xs">Ya, Hapus</button>
                              <button onclick="cancelDelete()" class="px-3 py-1 bg-slate-200 text-slate-600 rounded-lg text-xs">Batal</button>
                            ` : `
                              <button onclick="startDelete('${p.__backendId}')" class="p-2 hover:bg-red-50 rounded-lg text-red-600" title="Hapus">🗑️</button>
                            `}
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              `}
            </div>
          </div>
        </div>

    // ===== EXPORT DATA TO CSV =====
    function exportData() {
      const allExportData = allData;
      
      if (allExportData.length === 0) {
        showToast('Tidak ada data untuk dieksport!', 'warning');
        return;
      }
      
      // Prepare CSV header
      const allKeys = new Set();
      allExportData.forEach(item => {
        Object.keys(item).forEach(key => allKeys.add(key));
      });
      
      const headers = Array.from(allKeys).join(',');
      
      // Prepare CSV rows
      const rows = allExportData.map(item => {
        return Array.from(allKeys).map(key => {
          const value = item[key] || '';
          // Escape quotes and wrap in quotes if contains comma
          const escaped = String(value).replace(/"/g, '""');
          return escaped.includes(',') ? `"${escaped}"` : escaped;
        }).join(',');
      });
      
      const csv = [headers, ...rows].join('\n');
      
      // Download CSV
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      
      link.setAttribute('href', url);
      link.setAttribute('download', `backup_data_${new Date().getTime()}.csv`);
      link.style.visibility = 'hidden';
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      showToast('Data berhasil dieksport!');
    }

    // ===== IMPORT DATA FROM CSV =====
    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const csv = e.target.result;
          const lines = csv.split('\n').filter(line => line.trim());
          
          if (lines.length < 2) {
            showToast('File CSV tidak valid!', 'error');
            return;
          }
          
          // Parse header
          const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
          
          // Parse rows
          let importCount = 0;
          let skipCount = 0;
          
          for (let i = 1; i < lines.length; i++) {
            if (allData.length >= 999) {
              showToast('Batas data (999) sudah tercapai!', 'warning');
              break;
            }
            
            const values = parseCSVLine(lines[i]);
            if (values.length === 0) continue;
            
            const item = {};
            headers.forEach((header, idx) => {
              if (header && values[idx] !== undefined) {
                item[header] = values[idx];
              }
            });
            
            // Skip if already exists
            if (item.__backendId && allData.find(d => d.__backendId === item.__backendId)) {
              skipCount++;
              continue;
            }
            
            // Remove __backendId for new items
            delete item.__backendId;
            
            item.created_at = new Date().toISOString();
            
            const result = await window.dataSdk.create(item);
            if (result.isOk) {
              importCount++;
            }
          }
          
          showToast(`Impor selesai! ${importCount} data ditambahkan, ${skipCount} data dilewati.`);
          document.getElementById('importFile').value = '';
        } catch (err) {
          showToast('Gagal mengimpor data: ' + err.message, 'error');
        }
      };
      
      reader.readAsText(file);
    }

    // ===== PARSE CSV LINE =====
    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let insideQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const nextChar = line[i + 1];
        
        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            current += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      
      result.push(current.trim());
      return result;
    }

                    <label class="block text-sm font-medium text-slate-700 mb-1">${isEdit ? 'Password Baru (kosongkan jika tidak diubah)' : 'Password *'}</label>
                    <input type="password" name="password" ${!isEdit ? 'required' : ''} class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:border-blue-500">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Role</label>
                    <select name="role" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:border-blue-500">
                      <option value="operator" ${editingItem?.role === 'operator' ? 'selected' : ''}>Operator</option>
                      <option value="admin" ${editingItem?.role === 'admin' ? 'selected' : ''}>Admin</option>
                    </select>
                  </div>
                </div>
              `}
              
              <input type="hidden" name="formType" value="${type}">
              
              <div class="flex gap-3 pt-4">
                <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-50 font-medium transition">
                  Batal
                </button>
                <button type="submit" class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium transition" ${isLoading ? 'disabled' : ''}>
                  ${isLoading ? 'Menyimpan...' : 'Simpan'}
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // ===== MAIN LAYOUT =====
    function renderMainLayout(content) {
      return `
        <div class="flex h-full">
          ${renderSidebar()}
          <main class="flex-1 overflow-y-auto bg-slate-100">
            ${content}
          </main>
        </div>
        ${modalType ? renderModal(modalType) : ''}
      `;
    }

    // ===== RENDER APP =====
    let modalType = null;

    function render() {
      const app = document.getElementById('app');
      
      if (!currentUser) {
        app.innerHTML = renderLogin();
        attachLoginHandler();
      } else {
        let content = '';
        switch (currentPage) {
          case 'dashboard': content = renderDashboard(); break;
          case 'pegawai': content = renderPegawai(); break;
          case 'pelayanan': content = renderPelayanan(); break;
          case 'laporan': content = renderLaporan(); break;
          case 'users': content = renderUsers(); break;
          default: content = renderDashboard();
        }
        app.innerHTML = renderMainLayout(content);
      }
    }

    // ===== EVENT HANDLERS =====
    function attachLoginHandler() {
      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const username = document.getElementById('loginUsername').value;
          const password = document.getElementById('loginPassword').value;
          
          // Demo login
          if ((username === 'admin' && password === 'admin123') || 
              (username === 'operator' && password === 'operator123')) {
            currentUser = {
              nama: username === 'admin' ? 'Administrator' : 'Operator',
              username: username,
              role: username === 'admin' ? 'admin' : 'operator'
            };
            currentPage = 'dashboard';
            showToast('Login berhasil! Selamat datang.');
            render();
            return;
          }
          
          // Check from database
          const user = getUsers().find(u => u.username === username && u.password === password);
          if (user) {
            currentUser = user;
            currentPage = 'dashboard';
            showToast('Login berhasil! Selamat datang.');
            render();
          } else {
            showToast('Username atau password salah!', 'error');
          }
        });
      }
    }

    function navigateTo(page) {
      currentPage = page;
      searchQuery = '';
      filterStatus = 'all';
      deleteConfirmId = null;
      render();
    }

    function logout() {
      currentUser = null;
      currentPage = 'login';
      showToast('Anda telah keluar dari sistem.', 'info');
      render();
    }

    function openModal(type) {
      if (allData.length >= 999) {
        showToast('Batas data tercapai (999). Silakan hapus beberapa data terlebih dahulu.', 'warning');
        return;
      }
      modalType = type;
      editingItem = null;
      render();
    }

    function closeModal() {
      modalType = null;
      editingItem = null;
      render();
    }

    function editItem(id) {
      const item = allData.find(d => d.__backendId === id);
      if (item) {
        editingItem = item;
        modalType = item.type;
        render();
      }
    }

    function startDelete(id) {
      deleteConfirmId = id;
      render();
    }

    function cancelDelete() {
      deleteConfirmId = null;
      render();
    }

    async function confirmDelete(id) {
      const item = allData.find(d => d.__backendId === id);
      if (item) {
        isLoading = true;
        render();
        
        const result = await window.dataSdk.delete(item);
        isLoading = false;
        deleteConfirmId = null;
        
        if (result.isOk) {
          showToast('Data berhasil dihapus!');
        } else {
          showToast('Gagal menghapus data!', 'error');
        }
      }
    }

    function handleSearch(value) {
      searchQuery = value;
      render();
    }

    function handleFilter(value) {
      filterStatus = value;
      render();
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const type = formData.get('formType');
      
      const data = { type };
      formData.forEach((value, key) => {
        if (key !== 'formType') {
          data[key] = value;
        }
      });
      data.created_at = new Date().toISOString();
      
      isLoading = true;
      render();
      
      let result;
      if (editingItem) {
        const updatedItem = { ...editingItem, ...data };
        if (type === 'user' && !data.password) {
          updatedItem.password = editingItem.password;
        }
        result = await window.dataSdk.update(updatedItem);
      } else {
        result = await window.dataSdk.create(data);
      }
      
      isLoading = false;
      
      if (result.isOk) {
        showToast(editingItem ? 'Data berhasil diperbarui!' : 'Data berhasil ditambahkan!');
        closeModal();
      } else {
        showToast('Gagal menyimpan data!', 'error');
        render();
      }
    }

    // ===== INITIALIZE =====
    const dataHandler = {
      onDataChanged(data) {
        allData = data;
        render();
      }
    };

    async function init() {
      // Initialize Element SDK
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (newConfig) => {
            config = { ...defaultConfig, ...newConfig };
            render();
          },
          mapToCapabilities: (cfg) => ({
            recolorables: [],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined
          }),
          mapToEditPanelValues: (cfg) => new Map([
            ['nama_instansi', cfg.nama_instansi || defaultConfig.nama_instansi],
            ['alamat_instansi', cfg.alamat_instansi || defaultConfig.alamat_instansi]
          ])
        });
      }

      // Initialize Data SDK
      if (window.dataSdk) {
        const result = await window.dataSdk.init(dataHandler);
        if (!result.isOk) {
          console.error('Failed to initialize Data SDK');
        }
      }

      render();
    }

    init();
  </script>
